<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ko-fake-trmnl</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header><h1>ko-fake-trmnl</h1><br><p>Playlists and devices for your TRMNL KOReader plugin</p></header>
<main>
  <aside class="panel">
    <h2>Playlists</h2>
    <ul id="plist"></ul>
    <div class="bar"><input id="newpl" placeholder="playlist name" aria-label="New playlist name"><button id="addpl">Create playlist</button></div>
  </aside>
  <div>
    <section class="panel" id="editor"></section>
    <section class="panel">
      <h2>Devices</h2>
      <p class="hint">Devices appear here after their first request. Assign each one a playlist.</p>
      <table id="devs"></table>
      <div class="bar"><input id="newdev" placeholder="device id" aria-label="New device id"><button id="adddev">Add device</button></div>
    </section>
  </div>
</main>
<div id="msg" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a)){if(n.startsWith('on'))e.addEventListener(n.slice(2),v);else if(n in e&&n!=='list')e[n]=v;else e.setAttribute(n,v)}e.append(...k.flat());return e};
let db={playlists:{},devices:{}},cur=null,draft=[];
const api=async(m,p,b)=>{const r=await fetch('/admin/api'+p,{method:m,headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.status);return r.json()};
const toast=t=>{const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',1800)};
async function refresh(){db=await api('GET','/state');if(cur&&!db.playlists[cur])cur=null;if(!cur){cur=Object.keys(db.playlists)[0]||null;draft=cur?structuredClone(db.playlists[cur].items):[]}render()}
function pick(n){cur=n;draft=structuredClone(db.playlists[n].items);render()}
function render(){
  const ul=$('#plist');ul.replaceChildren(...Object.entries(db.playlists).map(([n,p])=>h('li',{},h('button',{className:'pl',onclick:()=>pick(n),'aria-current':n===cur},`${n} (${p.items.length})`))));
  if(!Object.keys(db.playlists).length)ul.append(h('li',{className:'hint'},'No playlists yet. Create one to start.'));
  const ed=$('#editor');ed.replaceChildren();
  if(!cur){ed.append(h('p',{className:'hint'},'Create a playlist to add images.'));}
  else{
    const url=`${location.origin}/playlist/${cur}`;
    ed.append(h('h2',{},cur),h('p',{className:'hint'},'Client URL: ',h('code',{},url)));
    draft.forEach((it,i)=>ed.append(h('div',{className:'row'},
      h('img',{src:it.image_url,alt:''}),
      h('input',{value:it.image_url,placeholder:'https://… or /images/file.png','aria-label':'Image URL',oninput:e=>it.image_url=e.target.value,onchange:render}),
      h('input',{type:'number',min:1,value:it.refresh_rate,'aria-label':'Refresh rate in seconds',oninput:e=>it.refresh_rate=+e.target.value}),
      h('div',{className:'mini'},
        h('button',{title:'Move up','aria-label':'Move up',onclick:()=>{if(i){[draft[i-1],draft[i]]=[draft[i],draft[i-1]];render()}}},'↑'),
        h('button',{title:'Move down','aria-label':'Move down',onclick:()=>{if(i<draft.length-1){[draft[i+1],draft[i]]=[draft[i],draft[i+1]];render()}}},'↓'),
        h('button',{title:'Remove','aria-label':'Remove item',onclick:()=>{draft.splice(i,1);render()}},'✕')))));
    if(!draft.length)ed.append(h('p',{className:'hint'},'No images yet. Add a URL or upload a file.'));
    const file=h('input',{type:'file',accept:'image/*',hidden:true,onchange:async e=>{const f=e.target.files[0];if(!f)return;const fd=new FormData();fd.append('file',f);
      const r=await fetch('/admin/api/images',{method:'POST',body:fd});if(!r.ok)return toast('Upload failed');draft.push({image_url:(await r.json()).url,refresh_rate:60});render()}});
    ed.append(h('div',{className:'bar'},
      h('button',{onclick:()=>{draft.push({image_url:'',refresh_rate:60});render()}},'Add image URL'),
      h('button',{onclick:()=>file.click()},'Upload image'),file,
      h('button',{className:'primary',onclick:async()=>{await api('PUT','/playlists/'+cur,{items:draft});await refresh();toast('Playlist saved')}},'Save playlist'),
      h('button',{onclick:async()=>{if(confirm(`Delete playlist "${cur}"?`)){await api('DELETE','/playlists/'+cur);cur=null;await refresh();toast('Playlist deleted')}}},'Delete playlist')));
  }
  renderDevices();
}
const ago=t=>{if(!t)return'';const s=Math.max(0,(db.now||Date.now()/1000)-t);if(s<90)return'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' d ago'};
const batt=d=>d.battery==null?'battery unknown':h('span',{className:'batt'+(d.battery<20?' low':''),title:'Battery level reported at last fetch'},h('span',{className:'cell'},h('i',{style:`width:${d.battery}%`})),d.battery+'%'+(d.battery<20?' (low)':''));
function renderDevices(){
  const t=$('#devs');t.replaceChildren(...Object.entries(db.devices).map(([id,d])=>h('tr',{},
    h('td',{},h('code',{},id),h('div',{className:'meta'},batt(d),d.last_seen?' · seen '+ago(d.last_seen):'')),
    h('td',{},h('select',{'aria-label':'Playlist for '+id,onchange:async e=>{await api('PUT','/devices/'+encodeURIComponent(id),{playlist:e.target.value});await refresh();toast('Device updated')}},
      h('option',{value:''},'(default playlist)'),...Object.keys(db.playlists).map(n=>h('option',{value:n,selected:n===d.playlist},n)))),
    h('td',{},h('code',{},`/device/${id}`)),
    h('td',{},h('button',{'aria-label':'Delete device '+id,onclick:async()=>{await api('DELETE','/devices/'+encodeURIComponent(id));await refresh();toast('Device deleted')}},'✕')))));
  if(!Object.keys(db.devices).length)t.append(h('tr',{},h('td',{className:'hint'},'No devices yet.')));
}
$('#addpl').onclick=async()=>{const n=$('#newpl').value.trim();if(!n)return;try{await api('PUT','/playlists/'+encodeURIComponent(n),{items:[]});cur=n;draft=[];$('#newpl').value='';await refresh();pick(n)}catch(e){toast('Use letters, numbers, - _ . :')}};
$('#adddev').onclick=async()=>{const n=$('#newdev').value.trim();if(!n)return;try{await api('PUT','/devices/'+encodeURIComponent(n),{playlist:null});$('#newdev').value='';await refresh()}catch(e){toast('Use letters, numbers, - _ . :')}};
refresh();
// keep battery / last-seen fresh without touching the playlist editor
setInterval(async()=>{
  if(document.activeElement&&document.activeElement.closest('#devs'))return; // don't close an open dropdown
  try{const s=await api('GET','/state');db.devices=s.devices;db.now=s.now;renderDevices()}catch(e){}
},30000);
</script>
</body>
</html>
